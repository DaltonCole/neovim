schemaVersion: "2.0.0"

# container-structure-test checks that hold regardless of which Dockerfile
# built the image. Merged at test time with a config generated by
# generate-cst-config.sh for the plugin/CoC lists and local-user symlink,
# which vary by Dockerfile/host. Run via tests/test-image.sh.

commandTests:
  - name: "nvim present"
    command: "which"
    args: ["nvim"]
    exitCode: 0
  - name: "git present"
    command: "which"
    args: ["git"]
    exitCode: 0
  - name: "ctags present"
    command: "which"
    args: ["ctags"]
    exitCode: 0
  - name: "clang-format present"
    command: "which"
    args: ["clang-format"]
    exitCode: 0
  - name: "python3 present"
    command: "which"
    args: ["python3"]
    exitCode: 0
  - name: "node present"
    command: "which"
    args: ["node"]
    exitCode: 0
  # npm comes from the npm registry (see Dockerfile), symlinked into
  # /usr/local/bin, so run it rather than just finding it on PATH. coc.nvim
  # runs it for :CocInstall/:CocUpdate of extensions with dependencies, and
  # coc-tsserver for Automatic Type Acquisition.
  - name: "npm runs"
    command: "npm"
    args: ["--version"]
    exitCode: 0
  - name: "curl present"
    command: "which"
    args: ["curl"]
    exitCode: 0
  - name: "less present (git's default pager)"
    command: "which"
    args: ["less"]
    exitCode: 0
  # nvim's own commands shell out to these: :make, :diffpatch, the bundled
  # gzip plugin for .bz2/.xz files, and :help hex-editing.
  - name: "tools nvim's built-in commands run (make, patch, bzip2, xz, xxd)"
    command: "bash"
    args: ["-c", "for b in make patch bzip2 xz xxd; do command -v $b >/dev/null || { echo \"missing: $b\"; exit 1; }; done"]
    exitCode: 0
  # The clangd that coc-clangd downloads uses the system's C and C++
  # standard headers; without them every #include <stdio.h> / <vector>
  # is an error. The image has the headers but no compiler.
  - name: "C and C++ standard headers present (for coc-clangd's clangd)"
    command: "bash"
    args: ["-c", "test -f /usr/include/stdio.h && ls /usr/include/c++/*/vector >/dev/null"]
    exitCode: 0
  - name: "nvim has python3 provider (required by python-mode)"
    command: "nvim"
    args: ["--headless", "-c", "if !has('python3') | cquit 1 | endif", "-c", "q"]
    exitCode: 0
  # mru/undodir are named-volume mount points, which take the image
  # directory's ownership when first created; ~/.config/nvim holds the
  # bind-mounted config and the zg spellfile; ~/.config/coc holds the
  # language servers coc-clangd/coc-rust-analyzer download on first use.
  - name: "user owns and can write its nvim/coc directories"
    command: "bash"
    args: ["-c", "for d in ~/.config/nvim ~/.config/nvim/mru ~/.config/nvim/undodir ~/.config/coc ~/.nvim; do test -O $d -a -w $d || { echo \"not owned/writable: $d\"; exit 1; }; done"]
    exitCode: 0

fileExistenceTests:
  - name: "init.vim removed from image (bind mount takes over at runtime)"
    path: "/home/docker/.config/nvim/init.vim"
    shouldExist: false
  - name: "mru dir scaffolded"
    path: "/home/docker/.config/nvim/mru"
    shouldExist: true
  - name: "undodir scaffolded"
    path: "/home/docker/.config/nvim/undodir"
    shouldExist: true
  - name: "vim-plug installed"
    path: "/home/docker/.local/share/nvim/site/autoload/plug.vim"
    shouldExist: true
