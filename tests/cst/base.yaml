schemaVersion: "2.0.0"

# container-structure-test checks that hold regardless of which Dockerfile
# built the image. Merged at test time with a config generated by
# generate-cst-config.sh for the plugin/CoC lists and local-user symlink,
# which vary by Dockerfile/host. Run via tests/test-image.sh.

commandTests:
  - name: "nvim present"
    command: "which"
    args: ["nvim"]
    exitCode: 0
  - name: "git present"
    command: "which"
    args: ["git"]
    exitCode: 0
  - name: "ctags present"
    command: "which"
    args: ["ctags"]
    exitCode: 0
  - name: "clang-format present"
    command: "which"
    args: ["clang-format"]
    exitCode: 0
  - name: "python3 present"
    command: "which"
    args: ["python3"]
    exitCode: 0
  - name: "node present"
    command: "which"
    args: ["node"]
    exitCode: 0
  - name: "npm present"
    command: "which"
    args: ["npm"]
    exitCode: 0
  - name: "curl present"
    command: "which"
    args: ["curl"]
    exitCode: 0
  - name: "nvim has python3 provider (required by Vimspector)"
    command: "nvim"
    args: ["--headless", "-c", "if !has('python3') | cquit 1 | endif", "-c", "q"]
    exitCode: 0
  # NOTE: still fails against wip-Dockerfile as of this writing - its
  # `VimspectorInstall ... +qall` build step quits nvim before the async
  # gadget download finishes, so no adapters land in the image. Dockerfile
  # fixed by running install_gadget.py directly instead (synchronous).
  - name: "vimspector debugpy adapter installed"
    command: "bash"
    args: ["-c", "find \"$HOME/.nvim/plugged/vimspector/gadgets\" -iname 'debugpy*' 2>/dev/null | grep -q ."]
    exitCode: 0
  - name: "vimspector vscode-cpptools adapter installed"
    command: "bash"
    args: ["-c", "find \"$HOME/.nvim/plugged/vimspector/gadgets\" -iname '*cpptools*' 2>/dev/null | grep -q ."]
    exitCode: 0

fileExistenceTests:
  - name: "init.vim removed from image (bind mount takes over at runtime)"
    path: "/home/docker/.config/nvim/init.vim"
    shouldExist: false
  - name: "mru dir scaffolded"
    path: "/home/docker/.config/nvim/mru"
    shouldExist: true
  - name: "undodir scaffolded"
    path: "/home/docker/.config/nvim/undodir"
    shouldExist: true
  - name: "vim-plug installed"
    path: "/home/docker/.local/share/nvim/site/autoload/plug.vim"
    shouldExist: true
